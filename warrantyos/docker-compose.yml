services:
  db:
    image: postgres:16
    container_name: warrantyos_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: warrantyos
      POSTGRES_PASSWORD: warrantyos
      POSTGRES_DB: warrantyos
    ports:
      - "5432:5432"
    volumes:
      - warrantyos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warrantyos"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: warrantyos_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://warrantyos:warrantyos@db:5432/warrantyos
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  warrantyos_pgdata:
